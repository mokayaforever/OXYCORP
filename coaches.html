<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OXYCORP — Meet Our Coaches</title>
  <link rel="stylesheet" href="global.css" />
  <style>
    .coaches-hero { padding: 7rem 0 3rem; }
    .coaches-hero h1 { font-family: var(--font-d); font-size: 2.8rem; font-weight: 700; }
    .coaches-hero p { color: var(--muted); max-width: 560px; margin-top: 1rem; line-height: 1.7; }

    .filter-bar {
      display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 2.5rem;
      padding: 1.2rem 1.5rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r);
    }
    .filter-btn {
      font-family: var(--font-m); font-size: 0.65rem; text-transform: uppercase;
      letter-spacing: 0.1em; padding: 0.4rem 1rem; border-radius: 2px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active { background: rgba(37,99,235,0.08); border-color: rgba(37,99,235,0.3); color: var(--primary); }

    .coaches-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem; margin-bottom: 4rem;
    }

    .coach-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 0; overflow: hidden;
      transition: all 0.3s ease; cursor: pointer;
    }
    .coach-card:hover { border-color: rgba(37,99,235,0.35); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.06); }

    .coach-card__header {
      padding: 1.8rem 1.5rem 1.2rem; position: relative;
    }
    .coach-card__accent {
      position: absolute; top: 0; left: 0; right: 0; height: 4px;
    }
    .coach-card__avatar {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-m); font-size: 0.9rem; font-weight: 700;
      color: #fff; margin-bottom: 1rem;
    }
    .coach-card__name { font-family: var(--font-d); font-size: 1.15rem; font-weight: 600; }
    .coach-card__specialty {
      font-family: var(--font-m); font-size: 0.68rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--primary); margin-top: 0.3rem;
    }
    .coach-card__bio {
      padding: 0 1.5rem; color: var(--muted); font-size: 0.85rem;
      line-height: 1.7; margin-bottom: 1.2rem;
    }
    .coach-card__stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      border-top: 1px solid var(--border); background: var(--surface2);
    }
    .coach-stat {
      padding: 0.9rem 0.8rem; text-align: center;
      border-right: 1px solid var(--border);
    }
    .coach-stat:last-child { border-right: none; }
    .coach-stat__val {
      font-family: var(--font-d); font-size: 1rem; font-weight: 700; color: var(--text);
    }
    .coach-stat__label {
      font-family: var(--font-m); font-size: 0.55rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--muted); margin-top: 0.15rem;
    }
    .coach-card__actions {
      display: flex; gap: 0.6rem; padding: 1rem 1.5rem 1.5rem;
    }
    .coach-card__actions .btn {
      flex: 1; justify-content: center; font-size: 0.78rem; padding: 0.6rem 1rem;
    }

    /* Coach Detail Modal */
    .coach-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px); z-index: 1000;
      display: none; align-items: center; justify-content: center;
      padding: 2rem;
    }
    .coach-modal-overlay.active { display: flex; }
    .coach-modal {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; max-width: 560px; width: 100%;
      max-height: 85vh; overflow-y: auto; position: relative;
    }
    .coach-modal__close {
      position: absolute; top: 1rem; right: 1rem;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 50%; width: 32px; height: 32px;
      cursor: pointer; font-size: 0.9rem; display: flex;
      align-items: center; justify-content: center;
    }
    .coach-modal__top { padding: 2rem 2rem 1.5rem; }
    .coach-modal__body { padding: 0 2rem 2rem; }

    @media (max-width: 700px) {
      .coaches-grid { grid-template-columns: 1fr; }
      .coaches-hero h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <section class="coaches-hero">
      <div class="container">
        <h1>Meet Our <em>Coaches</em></h1>
        <p>Handpicked industry professionals with real-world experience — not just theory. Each coach brings decades of music business expertise across genres, from Afrobeats to classical.</p>
      </div>
    </section>

    <div class="container" style="padding-bottom:6rem;">
      <div class="filter-bar">
        <span style="font-family:var(--font-m);font-size:0.62rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);align-self:center;">Specialty:</span>
        <button class="filter-btn active" data-filter="all">All Coaches</button>
        <button class="filter-btn" data-filter="vocal">Vocal</button>
        <button class="filter-btn" data-filter="production">Production</button>
        <button class="filter-btn" data-filter="business">Business</button>
        <button class="filter-btn" data-filter="performance">Performance</button>
        <button class="filter-btn" data-filter="songwriting">Songwriting</button>
        <button class="filter-btn" data-filter="marketing">Marketing</button>
        <button class="filter-btn" data-filter="management">Management</button>
      </div>

      <div class="coaches-grid" id="coachesGrid">
        <div style="color:var(--muted);font-size:0.85rem;padding:2rem;">Loading coaches…</div>
      </div>
    </div>
  </div>

  <!-- Coach Detail Modal -->
  <div class="coach-modal-overlay" id="coachModal" onclick="if(event.target===this)closeCoachModal()">
    <div class="coach-modal">
      <button class="coach-modal__close" onclick="closeCoachModal()">✕</button>
      <div class="coach-modal__top" id="modalTop"></div>
      <div class="coach-modal__body" id="modalBody"></div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    let allCoaches = [];

    async function loadCoaches() {
      try {
        const res = await fetch('/api/coaches');
        allCoaches = await res.json();
      } catch (e) {
        console.warn('Failed to load coaches:', e);
      }
      renderCoaches(allCoaches);
    }

    function renderCoaches(coaches) {
      const grid = document.getElementById('coachesGrid');
      if (!coaches.length) {
        grid.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;padding:2rem;grid-column:1/-1;">No coaches found for this specialty.</div>';
        return;
      }
      grid.innerHTML = coaches.map(c => `
        <div class="coach-card" onclick="openCoachModal(${c.id})">
          <div class="coach-card__header">
            <div class="coach-card__accent" style="background:${c.accent_color};"></div>
            <div class="coach-card__avatar" style="background:${c.accent_color};">${c.image_initial}</div>
            <div class="coach-card__name">${c.name}</div>
            <div class="coach-card__specialty">${c.specialty}</div>
          </div>
          <div class="coach-card__bio">${c.bio.substring(0, 120)}${c.bio.length > 120 ? '…' : ''}</div>
          <div class="coach-card__stats">
            <div class="coach-stat">
              <div class="coach-stat__val">${c.experience_years}yr</div>
              <div class="coach-stat__label">Experience</div>
            </div>
            <div class="coach-stat">
              <div class="coach-stat__val">⭐ ${c.rating}</div>
              <div class="coach-stat__label">Rating</div>
            </div>
            <div class="coach-stat">
              <div class="coach-stat__val">${c.sessions_completed}</div>
              <div class="coach-stat__label">Sessions</div>
            </div>
          </div>
          <div class="coach-card__actions" onclick="event.stopPropagation()">
            <button class="btn btn-primary" onclick="openCoachModal(${c.id})">View Profile</button>
            <a href="advisor.html?topic=${encodeURIComponent('Tell me about working with coach ' + c.name + ' who specializes in ' + c.specialty)}" class="btn" style="border:1px solid var(--border);background:var(--surface2);">Ask AI</a>
          </div>
        </div>
      `).join('');
    }

    function openCoachModal(id) {
      const c = allCoaches.find(x => x.id === id);
      if (!c) return;
      const priceKES = (c.price_per_session).toLocaleString();

      document.getElementById('modalTop').innerHTML = `
        <div style="display:flex;align-items:center;gap:1.2rem;margin-bottom:1.5rem;">
          <div style="width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:1.1rem;font-weight:700;color:#fff;background:${c.accent_color};">${c.image_initial}</div>
          <div>
            <div style="font-family:var(--font-d);font-size:1.4rem;font-weight:700;">${c.name}</div>
            <div style="font-family:var(--font-m);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--primary);margin-top:0.2rem;">${c.specialty}</div>
          </div>
        </div>
      `;

      document.getElementById('modalBody').innerHTML = `
        <p style="color:var(--muted);font-size:0.88rem;line-height:1.75;margin-bottom:1.5rem;">${c.bio}</p>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0.6rem;margin-bottom:1.5rem;">
          <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:0.8rem;text-align:center;">
            <div style="font-family:var(--font-d);font-size:1.1rem;font-weight:700;">${c.experience_years}</div>
            <div style="font-family:var(--font-m);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-top:0.15rem;">Years Exp</div>
          </div>
          <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:0.8rem;text-align:center;">
            <div style="font-family:var(--font-d);font-size:1.1rem;font-weight:700;">⭐ ${c.rating}</div>
            <div style="font-family:var(--font-m);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-top:0.15rem;">Rating</div>
          </div>
          <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:0.8rem;text-align:center;">
            <div style="font-family:var(--font-d);font-size:1.1rem;font-weight:700;">${c.sessions_completed}</div>
            <div style="font-family:var(--font-m);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-top:0.15rem;">Sessions</div>
          </div>
          <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:0.8rem;text-align:center;">
            <div style="font-family:var(--font-d);font-size:1.1rem;font-weight:700;">KES ${priceKES}</div>
            <div style="font-family:var(--font-m);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-top:0.15rem;">Per Session</div>
          </div>
        </div>
        <div style="display:flex;gap:0.8rem;">
          <a href="advisor.html?topic=${encodeURIComponent('I want to book a session with ' + c.name + ' (' + c.specialty + '). What should I prepare?')}" class="btn btn-primary" style="flex:1;justify-content:center;">Book Session → KES ${priceKES}</a>
          <a href="advisor.html?topic=${encodeURIComponent('Tell me more about ' + c.name + ' and their expertise in ' + c.specialty)}" class="btn" style="flex:1;justify-content:center;border:1px solid var(--border);background:var(--surface2);">Ask AI About Coach</a>
        </div>
      `;

      document.getElementById('coachModal').classList.add('active');
    }

    function closeCoachModal() {
      document.getElementById('coachModal').classList.remove('active');
    }

    // Filters
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const filter = this.dataset.filter;
        if (filter === 'all') return renderCoaches(allCoaches);
        const filtered = allCoaches.filter(c => c.specialty.toLowerCase().includes(filter));
        renderCoaches(filtered.length ? filtered : allCoaches);
      });
    });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCoachModal(); });
    window.addEventListener('load', loadCoaches);
  </script>
</body>
</html>
