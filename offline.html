<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OXYCORP — You're Offline</title>
  <link rel="stylesheet" href="global.css"/>
  <style>
    .offline-wrap {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; text-align: center; gap: 1.5rem;
    }
    .offline-icon { font-size: 3.5rem; }
    .offline-title { font-family: var(--font-d); font-size: 2rem; font-weight: 700; }
    .offline-sub { color: var(--muted); max-width: 420px; line-height: 1.7; }
    .cached-pages {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.8rem; width: 100%; max-width: 560px; margin-top: 0.5rem;
    }
    .cached-link {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1rem; text-decoration: none;
      color: var(--text); font-size: 0.85rem; font-weight: 500;
      transition: border-color 0.2s;
    }
    .cached-link:hover { border-color: rgba(37,99,235,0.4); }
    .cached-link span { display: block; font-size: 1.4rem; margin-bottom: 0.4rem; }
    .retry-btn {
      background: var(--primary); color: #fff; border: none;
      padding: 0.75rem 2rem; border-radius: 50px; font-size: 0.88rem;
      font-weight: 600; cursor: pointer; margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="offline-wrap">
    <div class="offline-icon">📡</div>
    <h1 class="offline-title">You're Offline</h1>
    <p class="offline-sub">No internet connection detected. You can still browse pages you've visited before — they're saved on your device.</p>

    <div class="cached-pages">
      <a href="index.html" class="cached-link"><span>🏠</span>Home</a>
      <a href="coaches.html" class="cached-link"><span>🎓</span>Coaches</a>
      <a href="market-intelligence.html" class="cached-link"><span>📊</span>Market</a>
      <a href="advisor.html" class="cached-link"><span>🤖</span>AI Advisor</a>
      <a href="roadmap.html" class="cached-link"><span>🗺️</span>Roadmap</a>
      <a href="guidance.html" class="cached-link"><span>🧭</span>Guidance</a>
    </div>

    <button class="retry-btn" onclick="window.location.reload()">↻ Try Again</button>
  </div>
</body>
</html>
