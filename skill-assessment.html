<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512"/>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Music Career Intelligence System for musicians, coaches, and music professionals."/>
<title>Skill Assessment — OXYCORP | AI Music Career Intelligence</title>
  <link rel="stylesheet" href="global.css" />
  <style>
    .assess-hero { padding: 7rem 0 4rem; }
    /* ── PROGRESS HEADER ── */
    .quiz-progress { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    .quiz-step-count { font-family: var(--font-m); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); }
    .quiz-bar { flex: 1; height: 4px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
    .quiz-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--teal)); border-radius: 99px; transition: width 0.4s ease; }

    /* ── QUIZ CARD ── */
    .quiz-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 3rem; max-width: 720px; margin: 0 auto;
      animation: fadeUp 0.4s ease;
    }
    .q-category {
      font-family: var(--font-m); font-size: 0.65rem; text-transform: uppercase;
      letter-spacing: 0.15em; color: var(--teal); margin-bottom: 1.2rem;
    }
    .q-text { font-family: var(--font-d); font-size: 1.8rem; font-weight: 600; line-height: 1.3; margin-bottom: 2.5rem; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .option-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-family: var(--font-b); font-size: 0.9rem;
      padding: 1.1rem 1.3rem; border-radius: var(--r); cursor: pointer;
      text-align: left; transition: all 0.2s; font-weight: 300;
      display: flex; align-items: center; gap: 0.7rem;
    }
    .option-btn:hover { border-color: var(--gold); background: var(--gold-dim); color: var(--text); }
    .option-btn.selected { border-color: var(--gold); background: var(--gold-dim); color: var(--gold); }
    .option-num {
      font-family: var(--font-m); font-size: 0.65rem; font-weight: 700;
      background: var(--surface); border: 1px solid var(--border);
      width: 22px; height: 22px; border-radius: 3px; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; }

    /* ── RESULTS ── */
    .results-section { display: none; }
    .radar-container { display: flex; gap: 3rem; align-items: center; flex-wrap: wrap; }
    .radar-wrap { flex-shrink: 0; }
    .skill-bars { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 1.2rem; }

    .skill-bar-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    .skill-bar-name { font-family: var(--font-m); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text); }
    .skill-bar-pct { font-family: var(--font-m); font-size: 0.68rem; color: var(--gold); }
    .skill-bar-track { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
    .skill-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--teal)); border-radius: 99px; width: 0; transition: width 1s ease; }

    .recs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; margin-top: 2rem; }
    .rec-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.5rem; }
    .rec-prio { font-family: var(--font-m); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.7rem; }
    .prio-high { color: var(--rose); }
    .prio-med  { color: var(--gold); }
    .prio-low  { color: var(--teal); }
    .rec-card h4 { font-family: var(--font-d); font-size: 1.15rem; margin-bottom: 0.4rem; }
    .rec-card p { color: var(--muted); font-size: 0.82rem; line-height: 1.7; }

    @media (max-width: 700px) {
      .options { grid-template-columns: 1fr; }
      .recs-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <!-- ASSESSMENT SECTION -->
    <section id="assessmentSection" class="assess-hero">

    <!-- QUIZ -->
    <div class="container" id="quizSection" style="padding-bottom:6rem;max-width:800px;">
      <div class="quiz-progress">
        <span class="quiz-step-count" id="stepCount">Question 1 of 12</span>
        <div class="quiz-bar"><div class="quiz-bar-fill" id="quizBarFill" style="width:8.3%"></div></div>
      </div>

      <div class="quiz-card" id="quizCard">
        <div class="q-category" id="qCategory">Musical Ability</div>
        <div class="q-text" id="qText">Loading...</div>
        <div class="options" id="optionsContainer"></div>
        <div class="quiz-nav">
          <button class="btn btn-ghost" id="prevBtn" onclick="prevQ()" style="display:none;">← Previous</button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextQ()" disabled>Next →</button>
        </div>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="container results-section" id="resultsSection" style="padding-bottom:6rem;">
      <div class="sec-label">Assessment Complete</div>
      <h2>Your Skill <em>Profile</em></h2>
      <p style="color:var(--muted);max-width:520px;margin:1rem 0 3rem;">AI-generated skill analysis based on your responses, benchmarked against your peer group.</p>

      <div class="card" style="margin-bottom:2rem;">
        <div class="radar-container">
          <div class="radar-wrap">
            <canvas id="radarChart" width="280" height="280"></canvas>
          </div>
          <div class="skill-bars" id="skillBars"></div>
        </div>
      </div>

      <div class="sec-label">AI Recommendations</div>
      <div class="recs-grid" id="recsGrid"></div>

      <div style="margin-top:2.5rem;display:flex;gap:1rem;flex-wrap:wrap;">
        <a href="roadmap.html" class="btn btn-primary btn-lg">Build My Roadmap →</a>
        <a href="advisor.html" class="btn btn-teal btn-lg">Discuss With AI Advisor</a>
        <button class="btn btn-ghost btn-lg" onclick="restartQuiz()">Retake Assessment</button>
      </div>
    </div>
  </div>
  </section>

  <script src="shared.js"></script>
  <script>
    const questions = [
      { cat:'Musical Ability',    q:'How would you rate your instrumental or vocal proficiency?',         opts:['Beginner — still learning basics','Intermediate — competent but developing','Advanced — highly proficient','Professional — performance-ready level'] },
      { cat:'Musical Ability',    q:'How strong is your music theory knowledge?',                          opts:['Minimal — I work by ear','Basic — I know chords and scales','Solid — I understand harmony and arrangement','Advanced — I can compose and arrange fully'] },
      { cat:'Music Production',   q:'How comfortable are you with DAW production (recording/mixing)?',    opts:['Not comfortable — I rely on producers','Basic — I can record but not mix','Intermediate — I produce my own demos','Advanced — professional-quality productions'] },
      { cat:'Music Production',   q:'Can you create radio-ready masters or work with mastering tools?',   opts:['No — I send to a mastering engineer','I\'ve tried but results are average','Yes — I can master for streaming standards','Professionally — I master for other artists'] },
      { cat:'Business & Industry',q:'How well do you understand music publishing and royalties?',         opts:['Very little — it\'s confusing to me','Basic — I know streaming pays royalties','Good — I\'m registered with a PRO','Expert — I manage publishing actively'] },
      { cat:'Business & Industry',q:'How developed is your artist brand and visual identity?',            opts:['Minimal — inconsistent or absent','In progress — some elements exist','Developed — consistent look and feel','Professional — distinctive and market-ready'] },
      { cat:'Marketing & Growth', q:'How effective is your social media content strategy?',              opts:['Posting randomly with little plan','I post regularly but no real strategy','I have a content plan and see growth','Data-driven strategy with strong metrics'] },
      { cat:'Marketing & Growth', q:'Have you run any music PR campaigns or press outreach?',            opts:['No — never reached out to press','I\'ve sent a few emails with no results','I\'ve had some blog/playlist coverage','I have an active PR strategy with results'] },
      { cat:'Live Performance',   q:'How strong are your live performance skills?',                       opts:['Rarely perform — need more experience','Perform occasionally at small venues','Regular performer — comfortable on stage','Seasoned — headliner quality stagecraft'] },
      { cat:'Live Performance',   q:'How developed is your live show infrastructure (band, tech, merch)?',opts:['Very basic — solo with backing track','Basic setup — small band or DJ setup','Solid setup — good tech and production','Professional touring setup with full team'] },
      { cat:'Networking',         q:'How strong is your music industry network?',                         opts:['Just starting — very few connections','A few local connections and collaborators','Good network — producers, bookers, bloggers','Strong — labels, managers, sync contacts'] },
      { cat:'Mental Resilience',  q:'How do you handle creative rejection and career setbacks?',         opts:['Struggling — setbacks affect me deeply','I recover but it takes significant time','Resilient — I bounce back fairly quickly','Very resilient — I use rejection as fuel'] },
    ];

    const API_BASE = '/api';

    let currentQ = 0, answers = [];

    function loadQ(idx) {
      const q = questions[idx];
      document.getElementById('qCategory').textContent = q.cat;
      document.getElementById('qText').textContent = q.q;
      document.getElementById('stepCount').textContent = `Question ${idx + 1} of ${questions.length}`;
      document.getElementById('quizBarFill').style.width = ((idx + 1) / questions.length * 100) + '%';
      document.getElementById('prevBtn').style.display = idx > 0 ? 'inline-flex' : 'none';
      document.getElementById('nextBtn').disabled = answers[idx] === undefined;
      document.getElementById('nextBtn').textContent = idx === questions.length - 1 ? 'View Results →' : 'Next →';

      const cont = document.getElementById('optionsContainer');
      const labels = ['A','B','C','D'];
      cont.innerHTML = q.opts.map((opt, i) => `
        <button class="option-btn ${answers[idx] === i ? 'selected' : ''}" onclick="selectOpt(${i})">
          <span class="option-num">${labels[i]}</span>${opt}
        </button>
      `).join('');

      // Animate card
      const card = document.getElementById('quizCard');
      card.style.animation = 'none';
      void card.offsetWidth;
      card.style.animation = 'fadeUp 0.35s ease';
    }

    function selectOpt(i) {
      answers[currentQ] = i;
      document.querySelectorAll('.option-btn').forEach((b, idx) => b.classList.toggle('selected', idx === i));
      document.getElementById('nextBtn').disabled = false;
    }

    function nextQ() {
      if (currentQ < questions.length - 1) { currentQ++; loadQ(currentQ); }
      else showResults();
    }
    function prevQ() { if (currentQ > 0) { currentQ--; loadQ(currentQ); } }
    function restartQuiz() {
      currentQ = 0; answers = [];
      document.getElementById('quizSection').style.display = 'block';
      document.getElementById('resultsSection').style.display = 'none';
      loadQ(0);
    }

    async function showResults() {
      // Ensure we have all 12 answers
      if (answers.length < 12 || answers.some(a => a === undefined)) {
        alert('Please answer all questions before viewing results.');
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/skill-assessments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quiz_answers: answers })
        });

        if (response.ok) {
          const result = await response.json();
          displayAssessmentResults(result);
        } else {
          const errorText = await response.text();
          alert(`Assessment failed: ${response.status} ${response.statusText}\n${errorText}`);
        }
      } catch (error) {
        alert(`Error connecting to server: ${error.message}`);
      }
    }

    function displayAssessmentResults(result) {
      document.getElementById('quizSection').style.display = 'none';
      const rs = document.getElementById('resultsSection');
      rs.style.display = 'block';

      const musicSkill = result.musical_skill_score;
      const production = result.technical_skill_score;
      const business = result.business_skill_score;

      // Render skill bars
      const skills = [
        { name:'Musical Ability',  pct: musicSkill },
        { name:'Production',       pct: production },
        { name:'Business',         pct: business },
        
      ];

      const barsEl = document.getElementById('skillBars');
      barsEl.innerHTML = skills.map(s => `
        <div class="skill-bar-row">
          <div class="skill-bar-header">
            <span class="skill-bar-name">${s.name}</span>
            <span class="skill-bar-pct">${s.pct}%</span>
          </div>
          <div class="skill-bar-track"><div class="skill-bar-fill" style="width:${s.pct}%"></div></div>
        </div>
      `).join('');

      // Radar chart
      drawRadar([musicSkill, production, business]);

      // AI Recommendations
      const recs = result.recommended_training.map(training => ({
        prio: 'med',  // Default priority
        title: 'Recommended Training',
        body: training
      }));
      document.getElementById('recsGrid').innerHTML = recs.map(r => `
        <div class="rec-card">
          <div class="rec-prio prio-${r.prio}">${r.prio.toUpperCase()} PRIORITY</div>
          <h4>${r.title}</h4>
          <p>${r.body}</p>
        </div>
      `).join('');

      rs.scrollIntoView({ behavior: 'smooth' });
    }

    function drawRadar(scores) {
      const canvas = document.getElementById('radarChart');
      const ctx = canvas.getContext('2d');
      const labels = ['Musical','Technical','Business'];
      const n = labels.length;
      const cx = 140, cy = 140, r = 110;

      ctx.clearRect(0, 0, 280, 280);

      // Grid rings
      [0.25, 0.5, 0.75, 1.0].forEach(f => {
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
          const x = cx + Math.cos(angle) * r * f;
          const y = cy + Math.sin(angle) * r * f;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(200,168,75,0.12)';
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      // Axes
      for (let i = 0; i < n; i++) {
        const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
        ctx.strokeStyle = 'rgba(200,168,75,0.15)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Data polygon
      ctx.beginPath();
      scores.forEach((s, i) => {
        const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
        const val   = (s / 100) * r;
        const x = cx + Math.cos(angle) * val;
        const y = cy + Math.sin(angle) * val;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.closePath();
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, 'rgba(200,168,75,0.3)');
      grad.addColorStop(1, 'rgba(29,228,180,0.15)');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,168,75,0.7)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Labels
      ctx.font = '11px "Space Mono", monospace';
      ctx.fillStyle = 'rgba(240,237,224,0.7)';
      ctx.textAlign = 'center';
      labels.forEach((l, i) => {
        const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
        const x = cx + Math.cos(angle) * (r + 22);
        const y = cy + Math.sin(angle) * (r + 22) + 4;
        ctx.fillText(l, x, y);
      });
    }

    // Init
    loadQ(0);
  </script>
</body>
</html>
